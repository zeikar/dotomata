[project]
name = "dotomata"
version = "0.1.1"
description = "AI pixel art sprite generator: concept art to a validated, animated, game-ready sprite sheet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zeikar" }]
keywords = ["pixel art", "sprite", "sprite sheet", "sprite generator", "game assets", "gamedev", "ai", "image generation", "claude code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
requires-python = "==3.12.*"
# Pinned exactly: convert.json records the tool versions and verify compares them.
dependencies = [
    "pillow==12.3.0",
    "numpy==2.5.4",
]

[project.urls]
Homepage = "https://github.com/zeikar/dotomata"
Documentation = "https://github.com/zeikar/dotomata/tree/main/docs"
Issues = "https://github.com/zeikar/dotomata/issues"
Changelog = "https://github.com/zeikar/dotomata/releases"

[project.scripts]
dotomata = "dotomata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotomata"]

[tool.hatch.build.targets.sdist]
# The README images are fetched from GitHub; keep the source archive small.
exclude = ["docs/images"]
